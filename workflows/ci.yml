name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Generate a small sample dataset (sanity check)
        run: python src/generate_receipts.py --n 5 --out /tmp/ci_data

      - name: Smoke-test the pipeline end to end
        run: |
          python -c "
          from pathlib import Path
          import json
          from PIL import Image
          from src.preprocessing import preprocess_pipeline
          from src.ocr import run_ocr
          from src.extraction import extract_fields

          out_dir = Path('/tmp/ci_data')
          manifest = json.loads((out_dir / 'manifest.json').read_text())
          entry = manifest[0]
          img = Image.open(out_dir.parent / entry['photo_path'])
          result = preprocess_pipeline(img)
          ocr = run_ocr(result.final)
          fields = extract_fields(ocr.text)
          print('Smoke test OK. Extracted fields:', fields)
          "
